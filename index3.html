<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Psych — Telekinesis Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #080b18;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }

    .instructions {
      margin: 0 auto 16px;
      max-width: 800px;
      color: #d8d2ff;
      line-height: 1.5;
    }

    #hud {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      font-size: 18px;
    }

    canvas {
      display: block;
      width: min(95vw, 900px);
      height: auto;
      margin: 0 auto;
      background: #11162c;
      border: 3px solid #c8bdff;
      border-radius: 12px;
      cursor: crosshair;
    }

    button {
      margin-top: 16px;
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      background: #6c4fff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #8068ff;
    }
  </style>
</head>

<body>
  <h1>Psych</h1>

  <p class="instructions">
    Move with WASD or the arrow keys. Hold E or the left mouse
    button to grab a nearby object, then release it to throw.
  </p>

  <div id="hud">
    <span id="health">Health: 100</span>
    <span id="energy">Mind Energy: 100</span>
    <span id="score">Enemies: 5</span>
  </div>

  <canvas id="game" width="900" height="560">
    Your browser does not support the HTML canvas element.
  </canvas>

  <button id="restart" type="button">
    Restart Game
  </button>

  <script src="./psych.js"></script>
</body>
</html>
