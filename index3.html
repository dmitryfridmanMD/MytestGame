<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Psych — Telekinesis Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b18;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 6px;
    }

    .instructions {
      margin: 0 10px 15px;
      color: #d8d2ff;
    }

    #hud {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 18px;
    }

    canvas {
      display: block;
      width: min(95vw, 900px);
      height: auto;
      margin: 0 auto;
      border: 3px solid #c8bdff;
      border-radius: 12px;
      background: #11162c;
      cursor: crosshair;
    }

    button {
      margin: 16px;
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      background: #6c4fff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #8068ff;
    }
  </style>

  <script src="./psych.js" defer></script>
</head>

<body>
  <h1>Psych</h1>

  <p class="instructions">
    Move with WASD or arrow keys. Hold E or the left mouse button to grab an object, then release to throw it.
  </p>

  <div id="hud">
    <span id="health">Health: 100</span>
    <span id="energy">Mind Energy: 100</span>
    <span id="score">Enemies: 5</span>
  </div>

  <canvas id="game" width="900" height="560">
    Your browser does not support HTML canvas.
  </canvas>

  <button id="restart" type="button">Restart Game</button>
</body>
</html>
