<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Rescue</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080a12;
      color: #f5f7ff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .game-shell {
      width: min(960px, 96vw);
      text-align: center;
      padding: 18px 0;
    }
    h1 { margin: 0 0 8px; }
    .instructions {
      margin: 0 auto 12px;
      color: #c9cce0;
      line-height: 1.45;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border: 3px solid #737a9b;
      border-radius: 12px;
      background: #101421;
      image-rendering: pixelated;
      box-shadow: 0 0 35px rgba(0,0,0,.55);
    }
    .controls {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #5967e8;
      color: white;
    }
    button:hover { filter: brightness(1.1); }
    .small {
      margin-top: 9px;
      font-size: 14px;
      color: #aeb4ce;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1>Dungeon Rescue</h1>
    <p class="instructions">
      Move with <b>A/D</b> or <b>←/→</b>. Jump with <b>W</b>, <b>↑</b>, or <b>Space</b>.
      In the boss battle, press <b>F</b> to cast fire. Your friend automatically casts ice.
    </p>

    <canvas id="game" width="900" height="520"></canvas>

    <div class="controls">
      <button id="startBtn">Start Game</button>
      <button id="restartBtn">Restart Level</button>
    </div>

    <div class="small">
      Fire does extra damage after your friend freezes the boss. Avoid the boss's dark magic.
    </div>
  </main>

  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    const keys = {};
    let gameStarted = false;
    let gameWon = false;
    let level = 1;
    let message = "";
    let messageTimer = 0;
    let cameraX = 0;

    const gravity = 0.72;
    const world = { width: 1900, height: 520 };

    const player = {
      x: 70, y: 390, w: 30, h: 44,
      vx: 0, vy: 0,
      speed: 4.4,
      jump: 13.5,
      onGround: false,
      facing: 1,
      health: 100,
      fireCooldown: 0,
      hurtCooldown: 0
    };

    const friend = {
      x: 770, y: 390, w: 28, h: 42,
      rescued: false,
      iceCooldown: 0,
      frozenTimer: 0
    };

    let platforms = [];
    let hazards = [];
    let projectiles = [];
    let enemyProjectiles = [];
    let particles = [];
    let puzzle = null;
    let boss = null;
    let exitDoor = null;
    let blackoutTimer = 0;

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function showMessage(text, seconds = 2) {
      message = text;
      messageTimer = Math.floor(seconds * 60);
    }

    function resetPlayer(x = 70, y = 390) {
      player.x = x;
      player.y = y;
      player.vx = 0;
      player.vy = 0;
      player.health = 100;
      player.fireCooldown = 0;
      player.hurtCooldown = 0;
      cameraX = 0;
    }

    function loadLevel(n) {
      level = n;
      projectiles = [];
      enemyProjectiles = [];
      particles = [];
      platforms = [];
      hazards = [];
      puzzle = null;
      boss = null;
      exitDoor = null;
      blackoutTimer = 0;
      friend.frozenTimer = 0;

      if (n === 1) setupParkour();
      if (n === 2) setupPuzzle();
      if (n === 3) setupBoss();
    }

    function setupParkour() {
      world.width = 1900;
      resetPlayer(55, 390);
      friend.rescued = false;
      friend.x = 1780;
      friend.y = 390;

      platforms = [
        {x: 0, y: 455, w: 290, h: 65},
        {x: 365, y: 420, w: 150, h: 30},
        {x: 580, y: 360, w: 145, h: 30},
        {x: 790, y: 305, w: 120, h: 28},
        {x: 975, y: 390, w: 170, h: 30},
        {x: 1210, y: 330, w: 130, h: 28},
        {x: 1410, y: 270, w: 130, h: 28},
        {x: 1600, y: 455, w: 300, h: 65}
      ];

      hazards = [
        {x: 290, y: 470, w: 75, h: 50},
        {x: 515, y: 470, w: 65, h: 50},
        {x: 725, y: 470, w: 250, h: 50},
        {x: 1145, y: 470, w: 65, h: 50},
        {x: 1340, y: 470, w: 70, h: 50},
        {x: 1540, y: 470, w: 60, h: 50}
      ];

      exitDoor = {x: 1815, y: 365, w: 48, h: 90, locked: false};
      showMessage("Level 1: Reach your friend's cell!");
    }

    function setupPuzzle() {
      world.width = 900;
      resetPlayer(90, 390);
      friend.x = 760;
      friend.y = 390;
      friend.rescued = false;

      platforms = [{x: 0, y: 455, w: 900, h: 65}];
      exitDoor = {x: 705, y: 345, w: 120, h: 110, locked: true};

      puzzle = {
        sequence: ["ice", "moon", "fire", "key"],
        chosen: [],
        solved: false,
        symbols: [
          {id: "fire", label: "🔥", x: 185, y: 210, r: 42},
          {id: "key", label: "🗝️", x: 330, y: 210, r: 42},
          {id: "ice", label: "❄️", x: 475, y: 210, r: 42},
          {id: "moon", label: "🌙", x: 620, y: 210, r: 42}
        ]
      };

      showMessage("Level 2: Click the runes in the correct order.");
    }

    function setupBoss() {
      world.width = 1200;
      resetPlayer(120, 390);
      friend.rescued = true;
      friend.x = 75;
      friend.y = 413;
      friend.iceCooldown = 50;
      friend.frozenTimer = 0;

      platforms = [{x: 0, y: 455, w: 1200, h: 65}];
      exitDoor = {x: 1125, y: 350, w: 60, h: 105, locked: true};

      boss = {
        x: 820, y: 330, w: 82, h: 125,
        health: 240,
        maxHealth: 240,
        frozen: 0,
        attackCooldown: 70,
        darkCooldown: 150,
        alive: true,
        contactCooldown: 0
      };

      showMessage("Level 3: Defeat the Warden and escape!");
    }

    function restartLevel() {
      gameWon = false;
      loadLevel(level);
      gameStarted = true;
      startBtn.textContent = "Pause";
    }

    function handleMovement() {
      player.vx = 0;

      if (keys["a"] || keys["arrowleft"]) {
        player.vx = -player.speed;
        player.facing = -1;
      }

      if (keys["d"] || keys["arrowright"]) {
        player.vx = player.speed;
        player.facing = 1;
      }

      const wantsJump = keys["w"] || keys["arrowup"] || keys[" "];
      if (wantsJump && player.onGround) {
        player.vy = -player.jump;
        player.onGround = false;
      }
    }

    function movePlayer() {
      const oldY = player.y;

      player.x += player.vx;
      for (const p of platforms) {
        if (rectsOverlap(player, p)) {
          if (player.vx > 0) player.x = p.x - player.w;
          if (player.vx < 0) player.x = p.x + p.w;
        }
      }

      player.vy += gravity;
      player.y += player.vy;
      player.onGround = false;

      for (const p of platforms) {
        if (rectsOverlap(player, p)) {
          if (player.vy > 0 && oldY + player.h <= p.y + 12) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
          } else if (player.vy < 0 && oldY >= p.y + p.h - 12) {
            player.y = p.y + p.h;
            player.vy = 0;
          }
        }
      }

      player.x = clamp(player.x, 0, world.width - player.w);

      for (const h of hazards) {
        if (rectsOverlap(player, h)) {
          showMessage("You fell into the spikes!");
          resetPlayer(55, 390);
        }
      }

      if (player.y > canvas.height + 150) {
        showMessage("You fell!");
        resetPlayer(level === 3 ? 120 : 55, 390);
      }

      if (level === 1 && exitDoor && rectsOverlap(player, exitDoor)) {
        loadLevel(2);
      }

      if (level === 2 && exitDoor && !exitDoor.locked && rectsOverlap(player, exitDoor)) {
        loadLevel(3);
      }

      if (level === 3 && exitDoor && !exitDoor.locked && rectsOverlap(player, exitDoor)) {
        gameWon = true;
        gameStarted = false;
        startBtn.textContent = "Play Again";
        showMessage("You escaped the dungeon together!", 999);
      }
    }

    function castFire() {
      if (level !== 3 || !boss || !boss.alive || player.fireCooldown > 0) return;

      player.fireCooldown = 24;

      projectiles.push({
        type: "fire",
        x: player.x + player.w / 2,
        y: player.y + 17,
        vx: 8 * player.facing,
        vy: 0,
        r: 9,
        life: 110
      });
    }

    function castIce() {
      if (!boss || !boss.alive || friend.iceCooldown > 0 || friend.frozenTimer > 0) return;

      friend.iceCooldown = 100;

      const dx = boss.x - friend.x;
      const dy = boss.y - friend.y;
      const len = Math.hypot(dx, dy) || 1;

      projectiles.push({
        type: "ice",
        x: friend.x + friend.w,
        y: friend.y + 18,
        vx: (dx / len) * 5.2,
        vy: (dy / len) * 5.2,
        r: 8,
        life: 170
      });
    }

    function bossAttack() {
      if (!boss || !boss.alive || boss.attackCooldown > 0) return;

      boss.attackCooldown = boss.frozen > 0 ? 110 : 72;

      const dx = player.x - boss.x;
      const dy = player.y - boss.y;
      const len = Math.hypot(dx, dy) || 1;

      enemyProjectiles.push({
        type: "shadowBolt",
        x: boss.x,
        y: boss.y + 42,
        vx: (dx / len) * 5.2,
        vy: (dy / len) * 5.2,
        r: 10,
        life: 180
      });
    }

    function bossDarkMagic() {
      if (!boss || !boss.alive || boss.darkCooldown > 0) return;

      boss.darkCooldown = 230;

      const dx = player.x - boss.x;
      const dy = player.y - boss.y;
      const len = Math.hypot(dx, dy) || 1;

      enemyProjectiles.push({
        type: "darkMagic",
        x: boss.x,
        y: boss.y + 70,
        vx: (dx / len) * 3.7,
        vy: (dy / len) * 3.7,
        r: 17,
        life: 240
      });

      showMessage("The Warden casts Dark Eclipse!");
    }

    function damagePlayer(amount) {
      if (player.hurtCooldown > 0) return;

      player.health -= amount;
      player.hurtCooldown = 35;
      player.x -= 30 * player.facing;

      if (player.health <= 0) {
        showMessage("The Warden defeated you. Try again!");
        setupBoss();
      }
    }

    function applyDarkMagic() {
      damagePlayer(10);
      blackoutTimer = 150;
      friend.frozenTimer = 210;
      friend.iceCooldown = Math.max(friend.iceCooldown, 210);
      showMessage("Dark magic blinded you and trapped your friend!");
    }

    function updateProjectiles() {
      for (const shot of projectiles) {
        shot.x += shot.vx;
        shot.y += shot.vy;
        shot.life--;

        if (boss && boss.alive && rectsOverlap(
          {x: shot.x - shot.r, y: shot.y - shot.r, w: shot.r * 2, h: shot.r * 2},
          boss
        )) {
          if (shot.type === "ice") {
            boss.frozen = 95;
            boss.health -= 8;
            showMessage("The Warden is frozen! Hit him with fire!");
          } else {
            const damage = boss.frozen > 0 ? 30 : 12;
            boss.health -= damage;
            if (boss.frozen > 0) boss.frozen = 0;
          }

          burst(shot.x, shot.y, shot.type);
          shot.life = 0;

          if (boss.health <= 0) {
            boss.health = 0;
            boss.alive = false;
            exitDoor.locked = false;
            blackoutTimer = 0;
            friend.frozenTimer = 0;
            showMessage("The Warden is defeated! Reach the exit!");
          }
        }
      }

      for (const shot of enemyProjectiles) {
        shot.x += shot.vx;
        shot.y += shot.vy;
        shot.life--;

        const hitbox = {
          x: shot.x - shot.r,
          y: shot.y - shot.r,
          w: shot.r * 2,
          h: shot.r * 2
        };

        if (rectsOverlap(hitbox, player)) {
          if (shot.type === "darkMagic") {
            applyDarkMagic();
          } else {
            damagePlayer(15);
          }

          burst(shot.x, shot.y, shot.type);
          shot.life = 0;
        }
      }

      projectiles = projectiles.filter(
        shot => shot.life > 0 && shot.x > -100 && shot.x < world.width + 100
      );

      enemyProjectiles = enemyProjectiles.filter(
        shot => shot.life > 0 && shot.x > -100 && shot.x < world.width + 100
      );
    }

    function burst(x, y, type) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 28,
          type
        });
      }
    }

    function updateParticles() {
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.life--;
      }

      particles = particles.filter(p => p.life > 0);
    }

    function updateBoss() {
      if (!boss || !boss.alive) return;

      if (boss.frozen > 0) boss.frozen--;
      if (boss.attackCooldown > 0) boss.attackCooldown--;
      if (boss.darkCooldown > 0) boss.darkCooldown--;
      if (boss.contactCooldown > 0) boss.contactCooldown--;
      if (player.fireCooldown > 0) player.fireCooldown--;
      if (player.hurtCooldown > 0) player.hurtCooldown--;
      if (friend.iceCooldown > 0) friend.iceCooldown--;
      if (friend.frozenTimer > 0) friend.frozenTimer--;
      if (blackoutTimer > 0) blackoutTimer--;

      if (boss.frozen <= 0) {
        boss.x += Math.sign(player.x - boss.x) * 1.15;
        boss.x = clamp(boss.x, 560, 1040);
      }

      if (friend.frozenTimer <= 0) {
        if (Math.abs(friend.x - player.x) > 58) {
          friend.x += Math.sign(player.x - friend.x) * 2.2;
        }
      }

      friend.y = 413;

      if (rectsOverlap(player, boss) && boss.contactCooldown <= 0) {
        boss.contactCooldown = 45;
        damagePlayer(18);
      }

      castIce();
      bossAttack();
      bossDarkMagic();
    }

    function update() {
      if (!gameStarted) return;

      handleMovement();
      movePlayer();

      if (level === 3) {
        updateBoss();
        updateProjectiles();
      }

      updateParticles();

      cameraX = clamp(
        player.x - canvas.width * 0.38,
        0,
        Math.max(0, world.width - canvas.width)
      );

      if (messageTimer > 0) messageTimer--;
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#171b2d");
      gradient.addColorStop(1, "#080a10");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-cameraX * 0.25, 0);
      ctx.fillStyle = "#21263a";

      for (let x = 0; x < world.width + 300; x += 120) {
        ctx.fillRect(x, 40, 70, 270);
        ctx.beginPath();
        ctx.moveTo(x - 15, 40);
        ctx.lineTo(x + 35, 5);
        ctx.lineTo(x + 85, 40);
        ctx.fill();
      }

      ctx.restore();

      ctx.fillStyle = "rgba(0,0,0,.22)";
      for (let y = 65; y < 450; y += 45) {
        for (let x = -(cameraX % 90); x < canvas.width; x += 90) {
          ctx.fillRect(x + ((y / 45) % 2) * 25, y, 65, 4);
        }
      }
    }

    function drawPlatforms() {
      for (const p of platforms) {
        ctx.fillStyle = "#4b4f5d";
        ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
        ctx.fillStyle = "#6b7082";
        ctx.fillRect(p.x - cameraX, p.y, p.w, 7);
      }

      for (const h of hazards) {
        const screenX = h.x - cameraX;
        ctx.fillStyle = "#8d2c34";
        const spikes = Math.ceil(h.w / 18);

        for (let i = 0; i < spikes; i++) {
          ctx.beginPath();
          ctx.moveTo(screenX + i * 18, h.y + h.h);
          ctx.lineTo(screenX + i * 18 + 9, h.y);
          ctx.lineTo(screenX + i * 18 + 18, h.y + h.h);
          ctx.fill();
        }
      }
    }

    function drawPerson(entity, bodyColor, accentColor) {
      const x = entity.x - cameraX;
      const y = entity.y;

      ctx.fillStyle = "#e7c39c";
      ctx.beginPath();
      ctx.arc(x + entity.w / 2, y + 9, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = bodyColor;
      ctx.fillRect(x + 6, y + 18, entity.w - 12, entity.h - 18);

      ctx.fillStyle = accentColor;
      ctx.fillRect(x + 4, y + 21, 6, 17);
      ctx.fillRect(x + entity.w - 10, y + 21, 6, 17);

      ctx.fillStyle = "#252a38";
      ctx.fillRect(x + 7, y + entity.h - 4, 6, 10);
      ctx.fillRect(x + entity.w - 13, y + entity.h - 4, 6, 10);
    }

    function drawDoor() {
      if (!exitDoor) return;

      const x = exitDoor.x - cameraX;
      ctx.fillStyle = exitDoor.locked ? "#3c2d42" : "#704c25";
      ctx.fillRect(x, exitDoor.y, exitDoor.w, exitDoor.h);

      ctx.strokeStyle = exitDoor.locked ? "#8e68a2" : "#c5924b";
      ctx.lineWidth = 5;
      ctx.strokeRect(x, exitDoor.y, exitDoor.w, exitDoor.h);

      ctx.fillStyle = "#d8bd6b";
      ctx.beginPath();
      ctx.arc(x + exitDoor.w - 13, exitDoor.y + exitDoor.h / 2, 5, 0, Math.PI * 2);
      ctx.fill();

      if (exitDoor.locked) {
        ctx.fillStyle = "#ded8ef";
        ctx.font = "28px Arial";
        ctx.fillText("🔒", x + exitDoor.w / 2 - 16, exitDoor.y + 58);
      }
    }

    function drawPuzzle() {
      if (!puzzle) return;

      ctx.fillStyle = "#ddd8ef";
      ctx.font = "22px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Hint: Cold night, burning key", canvas.width / 2, 105);

      ctx.font = "14px Arial";
      ctx.fillStyle = "#aeb4ce";
      ctx.fillText("Choose four runes", canvas.width / 2, 132);

      for (const rune of puzzle.symbols) {
        const selected = puzzle.chosen.includes(rune.id);

        ctx.beginPath();
        ctx.arc(rune.x, rune.y, rune.r, 0, Math.PI * 2);
        ctx.fillStyle = selected ? "#5967e8" : "#2c3147";
        ctx.fill();
        ctx.strokeStyle = "#9da5ce";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.font = "42px Arial";
        ctx.fillStyle = "#fff";
        ctx.fillText(rune.label, rune.x, rune.y + 14);
      }

      ctx.font = "18px Arial";
      ctx.fillStyle = puzzle.solved ? "#92f2b0" : "#d2d5e4";
      const selection = puzzle.chosen.length
        ? puzzle.chosen.join(" → ")
        : "No runes selected";
      ctx.fillText(selection, canvas.width / 2, 305);

      if (puzzle.solved) {
        ctx.fillText("The cell is unlocked!", canvas.width / 2, 340);
      }
    }

    function drawBoss() {
      if (!boss) return;

      const x = boss.x - cameraX;

      if (boss.alive) {
        ctx.fillStyle = boss.frozen > 0 ? "#8dd9ff" : "#21132e";
        ctx.fillRect(x, boss.y + 25, boss.w, boss.h - 25);

        ctx.fillStyle = "#4c205f";
        ctx.beginPath();
        ctx.arc(x + boss.w / 2, boss.y + 25, 29, Math.PI, 0);
        ctx.fill();

        ctx.fillStyle = "#d553ff";
        ctx.beginPath();
        ctx.arc(x + 28, boss.y + 45, 5, 0, Math.PI * 2);
        ctx.arc(x + 55, boss.y + 45, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#aa65ce";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(x + 10, boss.y + 65);
        ctx.lineTo(x - 20, boss.y + 100);
        ctx.moveTo(x + boss.w - 10, boss.y + 65);
        ctx.lineTo(x + boss.w + 20, boss.y + 100);
        ctx.stroke();

        if (boss.frozen > 0) {
          ctx.strokeStyle = "#d7f6ff";
          ctx.lineWidth = 3;
          ctx.strokeRect(x - 5, boss.y - 5, boss.w + 10, boss.h + 10);
        }
      }
    }

    function drawProjectiles() {
      for (const shot of projectiles) {
        const x = shot.x - cameraX;

        ctx.beginPath();
        ctx.arc(x, shot.y, shot.r, 0, Math.PI * 2);

        if (shot.type === "fire") {
          ctx.fillStyle = "#ff7a2f";
          ctx.shadowColor = "#ff8b3d";
        } else {
          ctx.fillStyle = "#8de9ff";
          ctx.shadowColor = "#d5f8ff";
        }

        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      for (const shot of enemyProjectiles) {
        const x = shot.x - cameraX;

        ctx.beginPath();
        ctx.arc(x, shot.y, shot.r, 0, Math.PI * 2);

        if (shot.type === "darkMagic") {
          ctx.fillStyle = "#050008";
          ctx.strokeStyle = "#c34cff";
          ctx.lineWidth = 4;
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillStyle = "#8b35b0";
          ctx.fill();
        }
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const x = p.x - cameraX;
        ctx.globalAlpha = p.life / 28;

        if (p.type === "fire") ctx.fillStyle = "#ff7a2f";
        else if (p.type === "ice") ctx.fillStyle = "#8de9ff";
        else if (p.type === "darkMagic") ctx.fillStyle = "#c34cff";
        else ctx.fillStyle = "#8b35b0";

        ctx.fillRect(x, p.y, 5, 5);
      }

      ctx.globalAlpha = 1;
    }

    function drawHUD() {
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(10,12,21,.82)";
      ctx.fillRect(14, 14, 265, 68);

      ctx.fillStyle = "#fff";
      ctx.font = "18px Arial";
      ctx.fillText("Level " + level, 28, 39);

      ctx.fillStyle = "#3e4255";
      ctx.fillRect(28, 51, 220, 16);

      ctx.fillStyle = player.health > 35 ? "#d44f58" : "#ffb04d";
      ctx.fillRect(28, 51, 220 * (player.health / 100), 16);

      ctx.strokeStyle = "#e2e4f1";
      ctx.strokeRect(28, 51, 220, 16);

      if (boss && boss.alive) {
        ctx.fillStyle = "rgba(10,12,21,.82)";
        ctx.fillRect(585, 14, 300, 68);

        ctx.fillStyle = "#fff";
        ctx.fillText("The Shadow Warden", 600, 39);

        ctx.fillStyle = "#3e4255";
        ctx.fillRect(600, 51, 255, 16);

        ctx.fillStyle = "#7f369a";
        ctx.fillRect(600, 51, 255 * (boss.health / boss.maxHealth), 16);

        ctx.strokeStyle = "#e2e4f1";
        ctx.strokeRect(600, 51, 255, 16);
      }

      if (level === 3 && friend.frozenTimer > 0) {
        ctx.fillStyle = "#d6c5ff";
        ctx.font = "16px Arial";
        ctx.fillText(
          "Friend trapped: " + Math.ceil(friend.frozenTimer / 60) + "s",
          28,
          104
        );
      }

      if (messageTimer > 0 && message) {
        ctx.textAlign = "center";
        ctx.font = "20px Arial";
        const width = Math.min(650, ctx.measureText(message).width + 50);

        ctx.fillStyle = "rgba(5,7,13,.86)";
        ctx.fillRect(canvas.width / 2 - width / 2, 445, width, 48);

        ctx.fillStyle = "#fff";
        ctx.fillText(message, canvas.width / 2, 476);
      }
    }

    function drawBlackout() {
      if (blackoutTimer <= 0) return;

      const alpha = blackoutTimer > 120
        ? 0.98
        : 0.82 * (blackoutTimer / 120);

      ctx.fillStyle = "rgba(0,0,0," + alpha + ")";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = "center";
      ctx.fillStyle = "#b778ff";
      ctx.font = "bold 28px Arial";
      ctx.fillText("DARK ECLIPSE", canvas.width / 2, canvas.height / 2 - 10);

      ctx.font = "17px Arial";
      ctx.fillStyle = "#ddd4eb";
      ctx.fillText(
        "You cannot see, and your friend cannot move.",
        canvas.width / 2,
        canvas.height / 2 + 28
      );
    }

    function drawStartOverlay() {
      if (gameStarted) return;

      ctx.fillStyle = "rgba(0,0,0,.55)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 42px Arial";

      if (gameWon) {
        ctx.fillText("Dungeon Escaped!", canvas.width / 2, 225);
        ctx.font = "21px Arial";
        ctx.fillText("You rescued your friend and defeated the Warden.", canvas.width / 2, 270);
      } else {
        ctx.fillText("Dungeon Rescue", canvas.width / 2, 225);
        ctx.font = "21px Arial";
        ctx.fillText("Press Start Game to begin.", canvas.width / 2, 270);
      }
    }

    function draw() {
      drawBackground();
      drawPlatforms();
      drawDoor();

      if (level === 2) drawPuzzle();

      if (level === 1) {
        drawPerson(friend, "#5b86d8", "#bfeaff");
      }

      if (level === 3) {
        drawBoss();
        drawProjectiles();
        drawPerson(friend, friend.frozenTimer > 0 ? "#8e83a3" : "#5b86d8", "#bfeaff");
      }

      drawPerson(player, "#b84d39", "#ff9a4b");
      drawParticles();
      drawHUD();
      drawBlackout();
      drawStartOverlay();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function handlePuzzleClick(event) {
      if (!gameStarted || level !== 2 || !puzzle || puzzle.solved) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (event.clientX - rect.left) * scaleX;
      const mouseY = (event.clientY - rect.top) * scaleY;

      for (const rune of puzzle.symbols) {
        const distance = Math.hypot(mouseX - rune.x, mouseY - rune.y);

        if (distance <= rune.r) {
          puzzle.chosen.push(rune.id);

          const position = puzzle.chosen.length - 1;
          if (puzzle.sequence[position] !== rune.id) {
            puzzle.chosen = [];
            showMessage("Wrong rune. The lock resets.");
            return;
          }

          if (puzzle.chosen.length === puzzle.sequence.length) {
            puzzle.solved = true;
            exitDoor.locked = false;
            friend.rescued = true;
            showMessage("The cell opens! Walk to your friend.");
          }

          return;
        }
      }
    }

    window.addEventListener("keydown", event => {
      keys[event.key.toLowerCase()] = true;

      if (["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(event.key)) {
        event.preventDefault();
      }

      if (event.key.toLowerCase() === "f") castFire();
    });

    window.addEventListener("keyup", event => {
      keys[event.key.toLowerCase()] = false;
    });

    canvas.addEventListener("click", handlePuzzleClick);

    startBtn.addEventListener("click", () => {
      if (gameWon) {
        gameWon = false;
        loadLevel(1);
        gameStarted = true;
        startBtn.textContent = "Pause";
        return;
      }

      gameStarted = !gameStarted;
      startBtn.textContent = gameStarted ? "Pause" : "Resume";
    });

    restartBtn.addEventListener("click", restartLevel);

    loadLevel(1);
    gameLoop();
  </script>
</body>
</html>
