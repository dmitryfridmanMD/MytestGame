<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elementbound: Apprentice of the Arcane</title>
<style>
  :root{
    --bg1:#090811;
    --bg2:#171225;
    --panel:rgba(22,18,37,.88);
    --text:#ffffff;
    --muted:#c9bedf;
    --purple:#8b5cf6;
    --violet:#a855f7;
    --gold:#ffd166;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    min-height:100%;
    overflow-x:hidden;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 50% 0%, #413068 0%, #211833 28%, #0d0a16 65%, #07060c 100%);
  }

  body{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    position:relative;
  }

  /* Floating magical lights */
  .orb{
    position:fixed;
    width:10px;
    height:10px;
    border-radius:50%;
    background:white;
    opacity:.55;
    box-shadow:0 0 18px 6px rgba(255,255,255,.25);
    animation:floatUp linear infinite;
    pointer-events:none;
  }

  .orb:nth-child(1){left:10%; animation-duration:9s; animation-delay:-2s;}
  .orb:nth-child(2){left:22%; animation-duration:12s; animation-delay:-7s;}
  .orb:nth-child(3){left:38%; animation-duration:10s; animation-delay:-4s;}
  .orb:nth-child(4){left:54%; animation-duration:13s; animation-delay:-9s;}
  .orb:nth-child(5){left:68%; animation-duration:11s; animation-delay:-5s;}
  .orb:nth-child(6){left:82%; animation-duration:14s; animation-delay:-8s;}
  .orb:nth-child(7){left:92%; animation-duration:10s; animation-delay:-1s;}

  @keyframes floatUp{
    0%{
      transform:translateY(110vh) scale(.7);
      opacity:0;
    }
    15%{opacity:.55}
    85%{opacity:.35}
    100%{
      transform:translateY(-15vh) scale(1.25);
      opacity:0;
    }
  }

  .launcher{
    width:min(820px,94vw);
    text-align:center;
    padding:52px 32px;
    border-radius:26px;
    background:var(--panel);
    border:1px solid rgba(169,139,255,.35);
    box-shadow:
      0 24px 60px rgba(0,0,0,.45),
      0 0 40px rgba(139,92,246,.12);
    backdrop-filter:blur(8px);
    position:relative;
    z-index:2;
  }

  .crest{
    font-size:5.5rem;
    display:inline-block;
    animation:levitate 3s ease-in-out infinite;
    filter:drop-shadow(0 0 20px rgba(168,85,247,.4));
  }

  @keyframes levitate{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-12px) rotate(2deg)}
  }

  h1{
    margin:12px 0 0;
    font-size:clamp(3rem,8vw,5.7rem);
    letter-spacing:.08em;
    line-height:.95;
    background:linear-gradient(90deg,#fff,#d8c6ff,#ffd166,#fff);
    background-size:250% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:titleGlow 4s linear infinite;
    text-shadow:0 0 30px rgba(181,145,255,.15);
  }

  @keyframes titleGlow{
    to{background-position:250% center}
  }

  h2{
    margin:12px 0 28px;
    color:#d8cbea;
    font-weight:500;
    letter-spacing:.06em;
  }

  .elements{
    display:flex;
    justify-content:center;
    gap:22px;
    font-size:2.5rem;
    margin:14px 0 26px;
  }

  .elements span{
    display:inline-block;
    animation:pulse 2.5s ease-in-out infinite;
  }

  .elements span:nth-child(2){animation-delay:.3s}
  .elements span:nth-child(3){animation-delay:.6s}
  .elements span:nth-child(4){animation-delay:.9s}

  @keyframes pulse{
    0%,100%{transform:scale(1); filter:brightness(1)}
    50%{transform:scale(1.16); filter:brightness(1.25)}
  }

  p{
    color:var(--muted);
    max-width:620px;
    margin:0 auto 30px;
    line-height:1.55;
    font-size:1.05rem;
  }

  .play{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:17px 38px;
    font-size:1.25rem;
    font-weight:900;
    border-radius:15px;
    background:linear-gradient(135deg,var(--purple),var(--violet));
    box-shadow:
      0 10px 28px rgba(139,92,246,.38),
      inset 0 0 0 1px rgba(255,255,255,.15);
    transition:transform .15s ease,filter .15s ease,box-shadow .15s ease;
    animation:buttonGlow 2.2s ease-in-out infinite;
  }

  .play:hover{
    transform:translateY(-3px) scale(1.035);
    filter:brightness(1.1);
  }

  @keyframes buttonGlow{
    0%,100%{box-shadow:0 10px 28px rgba(139,92,246,.35)}
    50%{box-shadow:0 10px 36px rgba(168,85,247,.62)}
  }

  .note{
    margin-top:26px;
    font-size:.88rem;
    color:#8f86a4;
  }

  @media (max-width:600px){
    .launcher{padding:38px 20px}
    .elements{gap:14px;font-size:2rem}
  }
</style>
</head>
<body>

<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>

<main class="launcher">
  <div class="crest">🧙‍♂️</div>

  <h1>ELEMENTBOUND</h1>
  <h2>Apprentice of the Arcane</h2>

  <div class="elements" aria-label="Fire, Water, Earth, Air">
    <span>🔥</span>
    <span>💧</span>
    <span>🪨</span>
    <span>⚡</span>
  </div>

  <p>
    Choose your element, train your magic, master new powers,
    battle dangerous creatures, and survive the final trial.
  </p>

  <!-- IMPORTANT: this now points to your renamed game file -->
  <a class="play" href="wizardApprentice.html">▶ PLAY GAME</a>

  <div class="note">
    Keep index8.html and wizardApprentice.html in the same GitHub folder.
  </div>
</main>

</body>
</html>
