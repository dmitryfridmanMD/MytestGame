<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elementbound: Apprentice of the Arcane</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at top, #3b2f63 0%, #191629 45%, #090811 100%);
    color: white;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }

  .launcher {
    width: min(760px, 90vw);
    text-align: center;
    padding: 50px 30px;
    border-radius: 24px;
    background: rgba(25, 22, 41, 0.92);
    border: 1px solid #5c4f86;
    box-shadow: 0 18px 55px rgba(0,0,0,.4);
  }

  .crest {
    font-size: 5rem;
    margin-bottom: 10px;
  }

  h1 {
    font-size: clamp(2.5rem, 7vw, 5rem);
    margin: 0;
    line-height: 1;
  }

  h2 {
    margin: 10px 0 28px;
    color: #d6caef;
    font-weight: 500;
  }

  p {
    color: #c5bdd9;
    max-width: 580px;
    margin: 0 auto 28px;
    line-height: 1.5;
  }

  .elements {
    font-size: 2.2rem;
    letter-spacing: .3rem;
    margin-bottom: 28px;
  }

  .play {
    display: inline-block;
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #7c5cff, #a142f4);
    padding: 16px 34px;
    font-size: 1.25rem;
    font-weight: 800;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(124,92,255,.35);
    transition: transform .15s, filter .15s;
  }

  .play:hover {
    transform: translateY(-3px) scale(1.02);
    filter: brightness(1.08);
  }

  .note {
    margin-top: 24px;
    font-size: .85rem;
    color: #8f87a8;
  }
</style>
</head>
<body>
  <main class="launcher">
    <div class="crest">🧙‍♂️</div>
    <h1>ELEMENTBOUND</h1>
    <h2>Apprentice of the Arcane</h2>

    <div class="elements">🔥 💧 🪨 ⚡</div>

    <p>
      Choose your element, train your magic, master new powers,
      battle dangerous creatures, and face the Archfiend in the final trial.
    </p>

    <a class="play" href="wizard_apprentice_game.html">▶ PLAY GAME</a>

    <div class="note">
      Keep this launcher file in the same folder as wizard_apprentice_game.html
    </div>
  </main>
</body>
</html>
